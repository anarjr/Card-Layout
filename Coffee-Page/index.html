<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section id="contend">

        <div class="header">
            <div class="logo">
                <i class="fa-solid fa-mug-hot"></i>
                <h2>Coffee</h2>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Menu</a></li>
                    <li><a href="#">Testimonials</a></li>
                    <li><a href="#">Gallery</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>
        </div>

        <div class="main">
            <div class="main-text">
                <div class="header-text-mini">
                    <h3>Best Coffee</h3>
                </div>
                <div class="header-text">
                    <h1>Make your day great with our special coffee!</h1>
                </div>
                <div class="text">
                    <p>Welcome to our coffee paradise where every bean tells a story and every cup sparks joy.</p>
                </div>
                <div class="buttons">
                    <a href="#" class="order">Order Now</a>
                    <a href="#" class="contact">Contact Us</a>

            <div class="header-photo">
                <img src="./image/download.jpg" alt="coffee">
